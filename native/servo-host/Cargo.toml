[package]
name = "zimlite-servo-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "GPL-3.0-only"

[dependencies]
servo = { path = "../../lib/servo/components/servo", default-features = false, features = ["bundled"] }
dpi = "0.1"
euclid = "0.22"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
gleam = "0.15.1"
glow = "0.17.0"
image = { version = "0.25.10", default-features = false }
libloading = "0.8.9"
surfman = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
debug = false
strip = true
codegen-units = 1

[workspace]
