<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir prefix="relative">fonts</dir>
  <cachedir prefix="xdg">fontconfig/zimlite-servo</cachedir>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family><family>FreeSans</family><family>Unifont</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Serif</family><family>FreeSerif</family><family>Unifont</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family><family>FreeMono</family><family>Unifont</family></prefer></alias>
</fontconfig>
